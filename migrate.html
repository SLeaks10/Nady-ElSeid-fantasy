<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>League import</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:30px auto;padding:0 16px}button{font:inherit;padding:10px 14px;margin:4px 0}pre{background:#f2f2f2;padding:10px;white-space:pre-wrap}</style>
</head><body>
<h1>League import (admin only)</h1>
<p id="who">Checking sign-in…</p>
<button id="signin">Sign in with Google</button>
<button id="run" disabled>Import league data</button>
<pre id="log"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),fs=firebase.firestore();
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
document.getElementById('signin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>log('Sign-in error: '+e.message));
auth.onAuthStateChanged(u=>{
  document.getElementById('who').textContent=u?('Signed in as '+u.email):'Not signed in';
  document.getElementById('run').disabled=!u;
});
async function runImport(){
  const data=await (await fetch('migrate.json',{cache:'no-store'})).json();
  const existing=(await fs.collection('players').get()).size;
  if(existing&&!confirm('The database already has '+existing+' players. Import again and overwrite?'))return 'cancelled';
  let batch=fs.batch(),n=0,total=0;
  const flush=async()=>{if(n){await batch.commit();batch=fs.batch();n=0}};
  for(const col of ['league','players','gameweeks','fixtures','news','squads']){
    // remove anything not in the copied data (e.g. test teams), so the site matches the old link exactly
    const cur=await fs.collection(col).get();let removed=0;const keep={};cur.docs.forEach(d=>{if(d.data().locked)keep[d.id]=true});
    for(const d of cur.docs){if(!(data[col]||{})[d.id]){batch.delete(d.ref);n++;removed++;if(n>=400)await flush()}}
    if(removed)log(col+': removed '+removed);
    for(const [id,doc] of Object.entries(data[col]||{})){
      batch.set(fs.doc(col+'/'+id),keep[id]?{...doc,locked:true}:doc);n++;total++;
      if(n>=400)await flush();
    }
    log(col+': '+Object.keys(data[col]||{}).length);
  }
  await flush();
  log('Done: '+total+' documents imported.');
  return total;
}
document.getElementById('run').onclick=()=>runImport().catch(e=>log('Error: '+e.code+' '+e.message));
</script>
</body></html>
