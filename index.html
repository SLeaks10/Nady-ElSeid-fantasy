<title>Fantasy Nady El Seid</title>

<style>
/* Layout: scoreboard masthead over a tab strip. The pitch card is the one loud element; everything else stays quiet paper and ink. */
:root{
  --bg:#eceee4; --surface:#f8f8f1; --surface2:#e2e6d8; --ink:#15211a; --muted:#566659; --line:#c9d0bf;
  --accent:#1c6b43; --accent-ink:#f4faf5; --armband:#f0b92b; --armband-ink:#2a2100;
  --bad:#b83a2e; --good:#1c6b43;
  --pitch-a:#2d7d4f; --pitch-b:#297347; --pitch-line:rgba(255,255,255,.55); --pitch-ink:#ffffff;
  --chip-bg:#fbfbf4; --chip-ink:#15211a; --scrim:rgba(10,18,13,.55);
  --t-gk:#8f6400; --t-def:#1f5fa8; --t-mid:#1c6b43; --t-fwd:#b3361f;
  --font-display:'Big Shoulders Display','Cairo','Arial Narrow',Impact,sans-serif;
  --font-body:'Hanken Grotesk','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1711; --surface:#13231a; --surface2:#1b3025; --ink:#e8efe3; --muted:#92a699; --line:#27402f;
    --accent:#5ccb8a; --accent-ink:#06210f; --bad:#ff8a7a; --good:#5ccb8a;
    --pitch-a:#1f5a39; --pitch-b:#1b5133; --chip-bg:#eef3e8; --chip-ink:#15211a; --scrim:rgba(0,0,0,.68);
    --t-gk:#f0b92b; --t-def:#7db3ee; --t-mid:#5ccb8a; --t-fwd:#f2907c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1711; --surface:#13231a; --surface2:#1b3025; --ink:#e8efe3; --muted:#92a699; --line:#27402f;
  --accent:#5ccb8a; --accent-ink:#06210f; --bad:#ff8a7a; --good:#5ccb8a;
  --pitch-a:#1f5a39; --pitch-b:#1b5133; --chip-bg:#eef3e8; --chip-ink:#15211a; --scrim:rgba(0,0,0,.68);
  --t-gk:#f0b92b; --t-def:#7db3ee; --t-mid:#5ccb8a; --t-fwd:#f2907c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{margin:0}
small,.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:3px solid var(--ink)}
.mast-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kicker{font:700 12px/1 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gwpill{font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:4px}
h1{font:800 clamp(36px,9vw,64px)/.92 var(--font-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0;color:var(--muted);max-width:60ch}
.sub.next{color:var(--ink);font-weight:700}
h1,.who b,.sname,.cn{unicode-bidi:plaintext}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 18px;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:9px 15px;border-radius:6px;font-weight:700;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel+.panel{margin-top:14px}
.panel h2{font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
.panel h3{font:700 13px/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;max-width:62ch}

.notice p{margin:0 0 8px;color:var(--muted)}
.notice p:last-child{margin-bottom:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:7px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;font:700 10px/1 var(--font-body);letter-spacing:.08em;padding:3px 5px;border-radius:3px;border:1px solid currentColor}
.tag+.tag{margin-left:3px}
.tag.GK{color:var(--t-gk)} .tag.DEF{color:var(--t-def)} .tag.MID{color:var(--t-mid)} .tag.FWD{color:var(--t-fwd)}
.armband{display:inline-block;background:var(--armband);color:var(--armband-ink);font:800 11px/1 var(--font-body);padding:3px 5px;border-radius:3px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.formrow>*{flex:1 1 140px;min-width:0}
.formrow>.btn{flex:0 0 auto}

/* standings */
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 62px 74px;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface2)}
.row.head{font:700 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-block:10px;background:var(--surface2)}
.row .r{text-align:right}
.row.ov{grid-template-columns:36px minmax(0,1fr) 74px}
.rank{font:800 26px/1 var(--font-display);text-align:center}
.rank.first{background:var(--armband);color:var(--armband-ink);border-radius:4px;padding:5px 0}
.who{display:flex;flex-direction:column;min-width:0}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font:800 30px/1 var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.pts.sm{font-size:20px;color:var(--muted)}

/* pitch */
.teamgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.teamgrid{grid-template-columns:minmax(0,1fr)}}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat span{display:block;font:700 10px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat b{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat b.bad{color:var(--bad)}
.stat small{display:block;margin-top:2px;font-size:12px}
.pitch{position:relative;border-radius:12px;padding:22px 12px;color:var(--pitch-ink);
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 54px,var(--pitch-b) 54px 108px);
  display:flex;flex-direction:column;gap:16px;min-height:360px}
.pitch::before{content:"";position:absolute;inset:8px;border:2px solid var(--pitch-line);border-radius:6px;pointer-events:none}

.pline{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;align-items:center}
.plabel{font:700 10px/1 var(--font-body);letter-spacing:.18em;opacity:.85}
.pitems{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:56px;align-items:stretch}
.pempty{font-size:12px;opacity:.7;align-self:center}
.pc{position:relative;background:var(--chip-bg);color:var(--chip-ink);border-radius:6px;padding:7px 8px 6px;width:102px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pc .cn{font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .cm{font-size:11px;opacity:.75}
.pc .badge{position:absolute;top:-8px;right:-6px}
.pc.out{outline:2px dashed var(--bad)}
.cacts{display:flex;gap:4px;justify-content:center;margin-top:5px}
.mini{border:1px solid rgba(0,0,0,.28);background:transparent;color:inherit;border-radius:4px;min-width:26px;height:24px;font:700 11px/1 var(--font-body);padding:0 5px}
.mini.on{background:var(--armband);color:var(--armband-ink);border-color:var(--armband)}
.checks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.checks li.ok{color:var(--ink)}
.checks li::before{content:"\2013";width:14px;text-align:center;font-weight:800}
.checks li.ok::before{content:"\2713";color:var(--good)}
.pool{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 44px 40px 78px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pn{display:flex;gap:8px;align-items:center;min-width:0}
.prow .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .r{text-align:right;font-variant-numeric:tabular-nums}
.prow .btn{padding:6px 8px;font-size:12px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.sin{width:54px;padding:6px 6px;text-align:center}
td.pt{font:800 18px/1 var(--font-display);text-align:right}

/* sheet and toast */
.sheet-back{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:100%;overflow:auto;padding:18px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.sheet-head h2{font:800 30px/1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .sname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sline{display:flex;justify-content:space-between;padding:8px 0;font-weight:700}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad);color:var(--surface)}
.status{display:inline-block;font:700 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px;border:1px solid var(--line)}
.status.open{color:var(--good);border-color:var(--good)} .status.locked{color:var(--t-gk);border-color:var(--t-gk)} .status.final{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* fixtures */
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:14px}
.fx{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx.next{background:var(--surface2)}
.fxw{font:800 24px/1 var(--font-display);text-transform:uppercase}
.fxo{font-weight:700;overflow-wrap:anywhere}
.fxm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
.res{font:800 22px/1 var(--font-display);padding:7px 10px;border-radius:5px;border:1px solid var(--line);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.res.W{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.res.L{color:var(--bad);border-color:var(--bad)}
.res.D{background:var(--surface2)}
.fxin{display:flex;gap:6px;align-items:center}
.fxin .sin{width:50px}
.wdl{font:800 12px/1 var(--font-body);padding:4px 6px;border-radius:3px;border:1px solid var(--line)}
.wdl.W{background:var(--good);color:var(--accent-ink);border-color:var(--good)} .wdl.L{color:var(--bad);border-color:var(--bad)}
@media (max-width:520px){.fx{grid-template-columns:62px minmax(0,1fr)}.fx .fxr{grid-column:2}}
.nrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.nrow .grow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg{font:800 16px/1 var(--font-body);width:20px;text-align:center}
.chg.up{color:var(--good)} .chg.down{color:var(--bad)}
.post{padding:9px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.post:last-child{border-bottom:0}
.post small{display:block}
.mtr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adminbadge{font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;background:var(--armband);color:var(--armband-ink);padding:7px 10px;border-radius:4px}
.langbtn{font:700 13px/1 var(--font-body);background:transparent;border:1px solid var(--ink);color:var(--ink);padding:7px 11px;border-radius:4px}
.langbtn:hover{background:var(--ink);color:var(--bg)}
[dir=rtl] *{letter-spacing:0!important;text-transform:none!important}
[dir=rtl] th,[dir=rtl] td{text-align:right}
[dir=rtl] td.r,[dir=rtl] th.r,[dir=rtl] .row .r,[dir=rtl] .prow .r,[dir=rtl] .pts{text-align:left}
[dir=rtl] .row{text-align:right}
[dir=rtl] .tag+.tag{margin-left:0;margin-right:3px}
[dir=rtl] .res{direction:ltr}
.pc{width:112px;padding:7px 6px 6px}
.pc.empty{background:transparent;border:2px dashed var(--pitch-line);box-shadow:none;color:var(--pitch-ink);display:flex;align-items:center;justify-content:center;min-height:62px;font:700 11px/1 var(--font-body);letter-spacing:.1em;opacity:.85}
.pc.empty:hover{transform:none}
.bench{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 12px 12px;margin-top:10px}
.bench .plabel{color:var(--ink);opacity:1}
.benchhead{display:flex;justify-content:space-between;gap:4px 12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px;color:var(--muted)}
.bench .pitems{justify-content:flex-start}
.bench .pc{background:var(--chip-bg)}
.bench .pc.empty{background:transparent;color:var(--muted);border-color:var(--line)}
.pc .ord{position:absolute;top:-8px;left:-6px;background:var(--ink);color:var(--bg);font:800 11px/1 var(--font-body);padding:3px 6px;border-radius:3px}
.mini{min-width:22px;padding:0 3px}
.mini:disabled{opacity:.35;cursor:not-allowed}
[dir=rtl] .pc .ord{left:auto;right:-6px}
[dir=rtl] .pc .badge{right:auto;left:-6px}
/* pitch view */
.pitchwrap{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.goalbar{background:linear-gradient(90deg,#7fe3ff,#6f7df0);color:#0c1a3d;font:800 22px/1 var(--font-display);text-align:center;padding:14px 12px 30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.pitch::before,.pitch::after{content:none}
.pitch{position:relative;background:none;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 4px 28px;margin-top:-18px;border-radius:0}
.pbg{position:absolute;inset:0;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 56px,var(--pitch-b) 56px 112px)}
.pbg::before{content:"";position:absolute;top:0;left:24%;right:24%;height:30%;border:2px solid var(--pitch-line);border-top:0}

.pbg+.pline{margin-top:30px}
.pitch .plabel{display:none}
.pitch .pitems,.bench .pitems{display:flex;justify-content:space-around;gap:8px;min-height:0;align-items:flex-start;flex-wrap:wrap}
.pc{width:100px;padding:0;background:transparent;box-shadow:none;border-radius:6px;overflow:visible;cursor:default}
.pc[data-act="sel"]{cursor:pointer}
.pc .tile{background:rgba(10,45,25,.5);border-radius:6px 6px 0 0;height:60px;display:flex;align-items:center;justify-content:center}

.pc .rb{position:absolute;z-index:2;left:-7px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--armband);color:var(--armband-ink);font:800 12px/22px var(--font-body);text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.pc .rb.tc{background:linear-gradient(135deg,#ff2d95,#ff9a00)!important;color:#fff!important;box-shadow:0 0 0 2px #fff,0 0 10px rgba(255,45,149,.75)!important;font-size:12px!important}

.pc .cacts{display:flex;gap:3px;justify-content:center;margin-top:5px}
.pc .cacts .mini{border-color:rgba(0,0,0,.3);min-width:20px;height:24px;padding:0 2px;color:var(--chip-ink)}
.pc .cacts .mini.on{color:var(--armband-ink)}
.pc.empty{width:100px;height:88px;min-height:0;background:transparent;border:2px dashed var(--pitch-line);border-radius:6px;box-shadow:none;color:var(--pitch-ink);display:flex;align-items:center;justify-content:center;font:700 11px/1 var(--font-body);opacity:.9}
.bench{background:linear-gradient(180deg,color-mix(in srgb,var(--pitch-a) 30%,var(--surface)),color-mix(in srgb,var(--pitch-a) 55%,var(--surface)));border:4px solid #8fe3f7;border-radius:12px;padding:12px 6px 14px;margin:12px 0 0}
.bslot{display:flex;flex-direction:column;align-items:center;gap:6px}
.blabel{font:700 12px/1 var(--font-body);letter-spacing:.06em;color:var(--ink)}
.bench .pc{background:transparent}
.bench .pc.empty{color:var(--muted);border-color:var(--muted)}
.subs{text-align:center;margin:10px 0 4px;display:flex;flex-direction:column;gap:4px}
.subs b{font:800 28px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.subs small{color:var(--muted)}
[dir=rtl] .pc .rb{left:auto;right:-7px}

.pc{width:100px}
.pc .tile{position:relative;height:84px;background:linear-gradient(135deg,#0f9f58,#14b86a);border:1px solid rgba(255,255,255,.35);border-bottom:0;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center}
.pc .kit{width:68px;height:76px;background:var(--kit-out) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pc .kit.gk{background-image:var(--kit-gk)}
.pc .plate{background:#fff;color:#2b0a3d;border-radius:0;padding:5px 4px;box-shadow:none}
.pc .plate .cn{font-weight:800;font-size:12.5px;color:#2b0a3d}
.pc .fxbar{background:linear-gradient(90deg,#c800ff,#ff1493 50%,#ff7a00);color:#fff;font:800 11px/1 var(--font-body);padding:6px 4px;border-radius:0 0 8px 8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pc .rb{left:5px;top:5px;width:22px;height:22px;background:#111;color:#fff;font:800 12px/22px var(--font-body)}
.pc .rb.v{background:#4b2a78}
[dir=rtl] .pc .rb{left:auto;right:5px}
.pc .cacts{margin-top:4px;background:#fff;border-radius:6px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pc .cacts .mini{color:#2b0a3d;background:#f3f0f6;border-color:#d9d2e0}
.pc .cacts .mini.on{background:#111;color:#fff}
.pc.empty{width:100px;height:116px}
.pc.sel{outline:3px solid #fff;outline-offset:2px}
/* compact cards */
.pc,.pc.empty{width:80px}
.pc .tile{height:62px}
.pc .kit{width:52px;height:58px}
.pc .plate{padding:4px 3px}
.pc .plate .cn{font-size:11.5px}
.pc .fxbar{font-size:10px;padding:5px 3px}
.pc .rb{width:18px;height:18px;font-size:10.5px;line-height:18px;left:4px;top:4px}
[dir=rtl] .pc .rb{right:4px}
.pc.empty{height:92px}
.pc .cacts .mini{min-width:17px;height:22px;font-size:11px}
.pitch .pitems,.bench .pitems{gap:4px}

  --bg:#f1edf4; --surface:#ffffff; --surface2:#ebe5f0; --ink:#37003c; --muted:#6d5a73; --line:#dcd2e2;

const POS=['GK','DEF','MID','FWD'];

function n(v){v=Number(v);return Number.isFinite(v)?v:0}
function concededOf(gw){
  if(!gw||gw.scoreAgainst===null||gw.scoreAgainst===undefined||gw.scoreAgainst==='')return null;

function playerPoints(pos,st,conc){

  p+=n(st.goals)*(GOAL_PTS[pos]||4);

  if(mins>=60&&conc!==null){

    if(def)p-=Math.floor(conc/2);
  }
  if(pos==='GK')p+=Math.floor(n(st.saves)/3);
  p-=n(st.yc);p-=3*n(st.rc);p-=2*n(st.og);p-=2*n(st.pm);p+=5*n(st.ps);
  p+=n(st.bonus);

}
function baseTeamAt(sq,g){
  let bk=-Infinity,best=null;
  const t=(sq&&sq.teams)||{};
  for(const k in t){
    const kn=Number(k.slice(1));
    if(kn<=g&&kn>bk&&t[k]&&Array.isArray(t[k].picks)&&t[k].chip!=='freehit'){bk=kn;best=t[k]}

}
function teamAt(sq,g){
  const ex=sq&&sq.teams&&sq.teams['g'+g];
  if(ex&&Array.isArray(ex.picks))return ex;

}
const chipOf=(sq,g)=>{const ex=sq&&sq.teams&&sq.teams['g'+g];return(ex&&ex.chip)||null};

function capMult(pos,chip){return chip==='triple'?(pos==='GK'?3.75:3):(pos==='GK'?2.5:2)}

  }

    const out=d.xi[pos][0];
    if(out){d.xi[pos][0]=id;d.bench[bi]=out;clearRoles(d,out);syncPicks(d);return true}

  const ps=d.picks.map(id=>players[id]).filter(Boolean);

  const xiIds=POS.flatMap(pos=>d.xi[pos]);
  const xiOk=POS.every(pos=>d.xi[pos].length===FORM[pos]&&d.xi[pos].every(id=>eligible(players[id],pos)));
  const gks=ps.filter(p=>p.pos==='GK').length;

    {ok:d.picks.length===cfg.squadSize&&new Set(d.picks).size===d.picks.length,text:d.picks.length+' of '+cfg.squadSize+' players picked'},
    {ok:xiOk,text:'Starting 7 filled: 1 GK, 2 DEF, 2 MID, 2 FWD'},
    {ok:d.bench.length===benchN,text:'Bench has '+benchN+' players'},
    {ok:gks<=2,text:'No more than two goalkeepers'},
    {ok:cost<=cfg.budget+1e-9,text:'Within budget ('+cost.toFixed(1)+' of '+cfg.budget.toFixed(1)+')'},
    {ok:!!d.captain&&!!d.vice&&d.captain!==d.vice&&xiIds.includes(d.captain)&&xiIds.includes(d.vice),text:'Captain and vice-captain are in the starting 7'},
    {ok:ps.length===d.picks.length&&ps.every(p=>p.active!==false),text:'Everyone picked is still available'}

function normPos(s){
  const u=String(s||'').trim().toUpperCase();

  if(['DEF','D','DF','DEFENDER','CB','LB','RB'].includes(u))return'DEF';
  if(['MID','M','MF','MIDFIELDER','CM','CDM','CAM'].includes(u))return'MID';
  if(['FWD','F','FW','FORWARD','ST','STRIKER','ATT','ATTACKER','WINGER','W'].includes(u))return'FWD';

function parseRoster(text){
  const out=[],bad=[];

}

    name:String(raw.name||DEF.name).slice(0,60),

    squadSize:Math.max(4,Math.round(n(raw.squadSize))||DEF.squadSize),
    freeTransfers:Math.max(0,Math.round(raw.freeTransfers==null?DEF.freeTransfers:n(raw.freeTransfers))),
    hitPoints:Math.max(0,raw.hitPoints==null?DEF.hitPoints:n(raw.hitPoints)),

/* ---------- derived data ---------- */
function computeAll(){
  const fin=finals();
  return Object.entries(S.squads).map(([id,sq])=>{
    const per={},hits={};
    let total=0;
    fin.forEach(g=>{const r=gwScore(sq,g,S.players,S.cfg);per[g.n]=r.total;hits[g.n]=r.hit;total+=r.total});
    return{id,sq,name:sq.teamName||'Unnamed team',mgr:mgrName(sq),per,hits,total};
  });
}
function playerSeason(){
  const out={};
  Object.values(S.players).forEach(p=>{out[p.id]={apps:0,goals:0,assists:0,pts:0,last:0}});
  const fin=finals();
  fin.forEach((g,i)=>{
    const conc=concededOf(g);
    Object.entries(g.stats||{}).forEach(([pid,st])=>{
      const p=S.players[pid];if(!p)return;
      const o=out[pid];
      if(n(st.mins)>0)o.apps++;
      o.goals+=n(st.goals);o.assists+=n(st.assists);
      const pts=playerPoints(p.pos,st,conc);
      o.pts+=pts;
      if(i===fin.length-1)o.last=pts;
    });
  });
  return out;
}

  }

function canAdd(p,d){
  if(d.picks.length>=S.cfg.squadSize)return'Squad is full';
  const cost=d.picks.reduce((a,id)=>a+n((S.players[id]||{}).price),0);
  if(cost+n(p.price)>S.cfg.budget+1e-9)return'Over budget';
  if(p.pos==='GK'&&d.picks.filter(id=>(S.players[id]||{}).pos==='GK').length>=2)return'Only two goalkeepers';
  if(!slotFor(p,d,benchCount()))return'No room for a '+p.pos;
  return'';
}

function chipLeft(sq,id,gwN){
  let used=0;const t=(sq&&sq.teams)||{};
  for(const k in t)if(k!=='g'+gwN&&t[k]&&t[k].chip===id)used++;
  return Math.max(0,S.cfg.chipUses-used);
}

function cairoOffsetMin(ts){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(ts));
  const g=t=>Number(p.find(x=>x.type===t).value);
  return Math.round((Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'))-Math.floor(ts/60000)*60000)/60000);
}
function cairoTs(y,m,d,H,M){
  let t=Date.UTC(y,m,d,H,M);
  for(let i=0;i<3;i++)t=Date.UTC(y,m,d,H,M)-cairoOffsetMin(t)*60000;
  return t;
}
function cairoToday(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
  const g=t=>Number(p.find(x=>x.type===t).value);
  return[g('year'),g('month')-1,g('day')];
}
function deadlineFor(gw){
  const hm=String(S.cfg.deadlineTime).split(':').map(Number),H=hm[0]||0,M=hm[1]||0,wd=S.cfg.deadlineDay;
  const fx=fxList().find(f=>!f.bye&&f.gw===gw.n&&/^\d{4}-\d{2}-\d{2}$/.test(String(f.date||'')));
  if(fx){
    const [y,m,d]=fx.date.split('-').map(Number);
    for(let k=1;k<=7;k++){
      const dt=new Date(Date.UTC(y,m-1,d-k));
      if(dt.getUTCDay()===wd)return{ts:cairoTs(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate(),H,M),enforced:true,dt};
    }
  }
  const [y,m,d]=cairoToday();
  for(let k=0;k<=8;k++){
    const dt=new Date(Date.UTC(y,m,d+k));
    if(dt.getUTCDay()!==wd)continue;
    const ts=cairoTs(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate(),H,M);
    if(ts>Date.now())return{ts,enforced:false,dt};
  }
  return null;
}

function predPts(p,f){
  if(!p||!hasRes(f))return null;
  if(n(p.a)===n(f.scoreFor)&&n(p.b)===n(f.scoreAgainst))return 3;
  return Math.sign(n(p.a)-n(p.b))===Math.sign(n(f.scoreFor)-n(f.scoreAgainst))?1:0;
}
function topPlayers(f){
  const g=f.gw!=null?S.gws['g'+f.gw]:null;
  if(!g||g.status!=='final')return null;
  const conc=concededOf(g);let best=-1e9,ids=[];
  Object.entries(g.stats||{}).forEach(([pid,st])=>{const p=S.players[pid];if(!p||!(n(st.mins)>0))return;const x=playerPoints(p.pos,st,conc);if(x>best){best=x;ids=[pid]}else if(x===best)ids.push(pid)});
  return ids.length?{ids,pts:best}:null;
}
function predTotal(p,f){
  if(!p)return null;
  let x=predPts(p,f),pl=0;
  if(p.pid){const t=topPlayers(f);if(t&&t.ids.includes(p.pid))pl=3}
  return x==null&&!pl?(topPlayers(f)?0:null):(x||0)+pl;
}
function predBoard(){
  const fx=fxList().filter(f=>!f.bye&&hasRes(f));
  return Object.entries(S.squads).map(([id,sq])=>{
    let pts=0,exact=0,made=0;
    fx.forEach(f=>{const p=(sq.pred||{})[f.id];if(!p)return;made++;const x=predPts(p,f),t=predTotal(p,f);pts+=t||0;if(x===3)exact++});
    return{id,name:sq.teamName||'Team',user:sq.username||'',pts,exact,made};
  }).filter(r=>r.made>0).sort((a,b)=>b.pts-a.pts||b.exact-a.exact||a.name.localeCompare(b.name));
}
function predLockTs(f){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(f.date||''));return m?cairoTs(+m[1],+m[2]-1,+m[3],0,0):0}

const ROLE_LINE={GK:'GK',LB:'DEF',LWB:'DEF',LCB:'DEF',CB:'DEF',RCB:'DEF',RB:'DEF',RWB:'DEF',SW:'DEF',LM:'MID',CDM:'MID',DM:'MID',CM:'MID',CAM:'MID',AM:'MID',RM:'MID',LW:'FWD',SS:'FWD',CF:'FWD',ST:'FWD',RW:'FWD',FW:'FWD',DEF:'DEF',MID:'MID',FWD:'FWD'};
const ROLE_ORDER=['LB','LWB','LCB','CB','SW','RCB','RB','RWB','LM','LW','CDM','DM','CM','CAM','AM','SS','CF','ST','FW','RM','RW'];
function findPlayerByName(q){
  q=String(q||'').trim().toLowerCase();if(!q)return null;
  const all=Object.values(S.players);
  let h=all.filter(p=>String(p.name).toLowerCase()===q);
  if(!h.length)h=all.filter(p=>String(p.name).toLowerCase().startsWith(q));
  if(!h.length)h=all.filter(p=>String(p.name).toLowerCase().includes(q));
  return h.length===1?h[0]:(h[0]||null);
}
function parseLineup(text){
  const lines={GK:[],DEF:[],MID:[],FWD:[]};
  String(text||'').split(/\n+/).forEach(row=>{
    const i=row.lastIndexOf(',');if(i<0)return;
    const name=row.slice(0,i),role=row.slice(i+1).trim().toUpperCase();
    const first=role.split('/')[0].trim();
    const line=ROLE_LINE[first];if(!line)return;
    const p=findPlayerByName(name);if(!p)return;
    lines[line].push({p,role,ord:ROLE_ORDER.indexOf(first)});
  });
  const out={};
  POS.forEach(k=>{out[k]=lines[k].map((x,i)=>({...x,i})).sort((a,b)=>(a.ord-b.ord)||(a.i-b.i)).map(x=>viewCard(x.p,k,{bar:x.role}))});
  return out;
}
function ownership(id){
  let c=0,tot=0;
  Object.values(S.squads).forEach(sq=>{const t=teamAt(sq,99999);if(!t)return;tot++;if(t.picks.includes(id))c++});
  return{c,tot,pct:tot?Math.round(100*c/tot):0};
}

  if(e&&(e.code==='invalid_argument'||e.code==='permission_denied'))return S.me.id?'That did not save. You do not have permission to change this.':'Sign in first to save changes.';

async function saveTeam(){
  const gw=activeGw(),d=S.draft,target=S.editTarget||S.me.id;
  if(!gw||!d)return;
  if(!S.me.isOwner&&(gw.status!=='open'||S.dlPassed)){toast('The deadline has passed.',true);return}
  const teamName=String(d.teamName||'').trim().slice(0,30),username=String(d.username||'').trim().slice(0,30);
  if(!teamName){toast('Give your team a name first.',true);return}
  const v=validateTeam(d,S.players,S.cfg);
  if(!v.valid){toast('Fix the checklist first.',true);return}
  const team={picks:d.picks,xi:d.xi,bench:d.bench,captain:d.captain,vice:d.vice,chip:d.chip||null};
  const k='g'+gw.n;
  if(S.squads[target])await db.doc('squads/'+target).update({teamName,username,teams:{[k]:team}});
  else await db.doc('squads/'+target).set({teamName,username,managerId:target.startsWith('m-')?null:target,teams:{[k]:team}});
  S.dirty=false;S.draftKey=null;
  toast('Team saved for GW '+gw.n+'.');
}
async function newGw(){
  const gws=sortedGws(),nn=(gws.length?gws[gws.length-1].n:0)+1;
  let opp=($('newOpp').value||'').trim(),date=($('newDate').value||'').trim(),link=null;
  if(!opp&&!date){
    link=fxList().find(f=>!f.bye&&!f.gw&&!hasRes(f)&&f.date>=todayIso())||null;
    if(link){opp=link.opponent||'';date=fmtDate(link.date)}
  }
  await db.doc('gameweeks/g'+nn).set({n:nn,opponent:opp,date,status:'open',scoreFor:null,scoreAgainst:null,stats:{}});
  if(link)await db.doc('fixtures/'+link.id).update({gw:nn});
  S.adminGw=nn;S.sdKey=null;
  toast('Gameweek '+nn+' created. Picks are open.');
}
async function saveGw(status){
  const g=S.gws['g'+S.sdKey];
  if(!g||!S.sd)return;
  const m=S.sd.meta;
  if(status==='final'&&m.against===''){toast('Enter goals conceded before finalizing, so clean sheets count.',true);return}
  const stats={};
  for(const pid in S.sd.stats){
    const st=S.sd.stats[pid],clean={};let any=false;
    SF.forEach(f=>{const v=n(st[f]);if(v){clean[f]=v;any=true}});
    if(any)stats[pid]=clean;
  }
  await db.doc('gameweeks/g'+g.n).set({n:g.n,opponent:m.opp.trim(),date:m.date.trim(),scoreFor:m.for===''?null:n(m.for),scoreAgainst:m.against===''?null:n(m.against),lineupText:String(m.lineup||'').slice(0,1500),status,stats});
  S.sdirty=false;S.sdKey=null;
  toast(status==='final'?'GW '+g.n+' finalized. Points are live.':status==='locked'?'Picks locked for GW '+g.n+'.':'Saved.');
}
async function addPlayer(){
  const name=($('npName').value||'').trim(),pos=$('npPos').value,price=Math.round(n($('npPrice').value)*10)/10;
  if(!name){toast('Enter a name.',true);return}
  await db.collection('players').add({name:name.slice(0,40),pos,price,active:true});
  toast(name+' added.');
}
async function bulk(){
  const r=parseRoster($('bulk').value);
  if(!r.out.length){toast('No valid lines found. Use: name, position, price.',true);return}
  for(const p of r.out)await db.collection('players').add({...p,active:true});
  toast(r.out.length+' players added'+(r.bad.length?'. Skipped '+r.bad.length+' line'+(r.bad.length>1?'s':'')+' I could not read.':'.'));
}

function updatePts(){
  if(!S.sd)return;
  const conc=S.sd.meta.against===''?null:n(S.sd.meta.against);
  document.querySelectorAll('[data-pt]').forEach(el=>{
    const p=S.players[el.dataset.pt];
    el.textContent=p?playerPoints(p.pos,S.sd.stats[el.dataset.pt],conc):0;
  });
}
function markUnsaved(){S.sdirty=true;const u=$('unsaved');if(u)u.hidden=false}
root.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;
  if(!k)return;
  if(k==='search'){S.search=t.value;const p=$('pool');if(p){p.innerHTML=poolHtml();if(S.lang==='ar'&&window.__trDom)window.__trDom(p)}return}
  if(k==='pin')return;
  if(k==='pred'){(S.pd||(S.pd={}))[t.dataset.id]=Object.assign((S.pd||{})[t.dataset.id]||{},{[t.dataset.s]:t.value});return}
  if(k==='tname'){S.draft.teamName=t.value;S.dirty=true;return}
  if(k==='uname'){S.draft.username=t.value;S.dirty=true;return}
  if(k==='stat'&&S.sd){
    const pid=t.dataset.pid,f=t.dataset.f;
    (S.sd.stats[pid]||(S.sd.stats[pid]={}))[f]=t.value===''?0:n(t.value);
    markUnsaved();updatePts();return;
  }
  if(k==='meta'&&S.sd){S.sd.meta[t.dataset.f]=t.value;markUnsaved();if(t.dataset.f==='against')updatePts()}
});
root.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.in==='fxdiff'){
    try{await db.doc('fixtures/'+t.dataset.id).update({diff:t.value===''?null:Number(t.value)})}catch(err){toast(errMsg(err),true)}
    return;
  }
  if(t.dataset&&t.dataset.in==='fx'){
    const val=t.value===''?null:Math.max(0,Math.round(n(t.value)));
    try{await db.doc('fixtures/'+t.dataset.id).update({[t.dataset.f]:val})}catch(err){toast(errMsg(err),true)}
    return;
  }
  if(!t.dataset||t.dataset.in!=='prow')return;
  const f=t.dataset.f,ref=db.doc('players/'+t.dataset.pid);
  let val;
  if(f==='active')val=t.checked;
  else if(f==='price')val=Math.max(0,Math.round(n(t.value)*10)/10);
  else if(f==='name'){val=t.value.trim().slice(0,40);if(!val)return}
  else val=t.value;
  try{
    const old=n((S.players[t.dataset.pid]||{}).price),nm=(S.players[t.dataset.pid]||{}).name||'';
    await ref.update({[f]:val});
    if(f==='price'&&val!==old)await db.doc('news/'+rid('n')).set({type:'price',pid:t.dataset.pid,name:nm,from:old,to:val,ts:Date.now()});
  }catch(err){toast(errMsg(err),true)}
});

  if(user){
    try{const me=await user.me();S.me={id:me.id||null,name:me.name||'',isOwner:!!me.isOwner}}catch(e){}
  }
  sub(db.doc('league/config'),'cfg',s=>{S.cfg=normCfg(s.exists?s.data():null)});
  sub(db.collection('players'),'players',q=>{const o={};q.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id}});S.players=o});
  sub(db.collection('gameweeks'),'gws',q=>{const o={};q.docs.forEach(d=>{o['g'+d.data().n]={...d.data()}});S.gws=o});
  sub(db.collection('fixtures'),'fixtures',q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.fixtures=o});
  sub(db.collection('news'),'news',q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.news=o});
  sub(db.collection('squads'),'squads',q=>{
    const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.allSquads={...o};
    const claimedIds=new Set(Object.values(o).map(x=>x.claimed).filter(Boolean));
    claimedIds.forEach(id=>{delete o[id]});
    S.squads=o;
    const ids=[...new Set(Object.values(o).map(s=>s.managerId).filter(Boolean))].sort();
    const key=ids.join(',');
    if(user&&ids.length&&key!==S.profKey){
      S.profKey=key;
      user.profiles(ids).then(p=>{S.profiles=p;onData()}).catch(()=>{});
    }
  });
}
render(true);
})();
</script>

</body></html>
